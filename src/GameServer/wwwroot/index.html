<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe demo client</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 460px; margin: 24px auto; padding: 0 12px; }
  .row { display: flex; gap: 6px; margin: 6px 0; }
  input { flex: 1; padding: 6px; }
  button { padding: 6px 10px; cursor: pointer; }
  #board { display: grid; grid-template-columns: repeat(3, 84px); gap: 6px; margin: 14px 0; }
  #board button { height: 84px; font-size: 32px; }
  #status { font-weight: 600; min-height: 1.4em; }
  pre { background: #8881; padding: 8px; height: 170px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<h3>Tic-Tac-Toe demo</h3>
<div class="row"><input id="pid" placeholder="player id (e.g. alice)"><button id="connect">Connect</button></div>
<div class="row"><button id="create">Create room</button><input id="rid" placeholder="room id"><button id="join">Join</button></div>
<div id="status"></div>
<div id="board"></div>
<pre id="log"></pre>
<script>
let ws = null, me = null, room = null;
const $ = id => document.getElementById(id);
const log = t => { $("log").textContent += t + "\n"; $("log").scrollTop = 1e9; };
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

for (let i = 0; i < 9; i++) {
  const b = document.createElement("button");
  b.onclick = () => send({ type: "move", cell: i });
  $("board").appendChild(b);
}

function render() {
  if (!room) return;
  [...$("board").children].forEach((b, i) => b.textContent = room.board[i]);
  const mark = room.playerX === me ? "X" : room.playerO === me ? "O" : "?";
  let s = `Room ${room.roomId} - you are ${mark} - ${room.status}`;
  if (room.status === "inprogress") s += room.turn === mark ? " - YOUR TURN" : " - opponent's turn";
  if (room.status === "finished") s += room.winnerId ? ` - winner: ${room.winnerId} (${room.reason})` : " - draw";
  $("status").textContent = s;
}

$("connect").onclick = () => {
  me = $("pid").value.trim();
  if (!me) return;
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?playerId=${encodeURIComponent(me)}`);
  ws.onopen = () => log("connected");
  ws.onclose = () => log("disconnected");
  ws.onmessage = e => {
    log(e.data);
    const m = JSON.parse(e.data);
    if (m.room) { room = m.room; render(); if (m.room.roomId) $("rid").value = m.room.roomId; }
  };
};
$("create").onclick = () => send({ type: "create_room" });
$("join").onclick = () => send({ type: "join_room", roomId: $("rid").value.trim() });
</script>
</body>
</html>
